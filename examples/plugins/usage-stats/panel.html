<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usage Stats</title>
<!-- Shared plugin UI kit: cards, stats, badges, charts, heatmap, states. -->
<link rel="stylesheet" href="/plugin-kit/panel.css" />
<style>
  /* A little local polish on top of the kit. */
  .app { display: flex; flex-direction: column; gap: 14px; }
  .app-head { align-items: flex-start; }
  .app-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .app-sub { margin: 2px 0 0; font-size: 11px; color: var(--pk-muted); }
  .app-sub b { color: var(--pk-fg); font-weight: 600; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .chart-head .pk-segmented { flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="app" id="view"></div>
  <div class="pk-tooltip" id="tip" role="tooltip"></div>

<script>
(function () {
  "use strict";

  var state = {
    theme: "light",
    lang: "en",
    metric: "calls",
    data: null,
    status: "loading", // loading | ready | empty | error
  };

  var METRICS = ["calls", "translations", "tokens", "cost"];
  var WEEKS = 26;
  var CELL_STEP = 15; // --pk-cell (12) + gap (3): used to align month labels.

  var COPY = {
    en: {
      title: "Usage",
      range30: "Last 30 days",
      calendar: "Calendar · 26 weeks",
      cost: "Cost",
      calls: "Calls",
      translations: "Translations",
      tokens: "Tokens",
      inTok: "in",
      outTok: "out",
      updated: "updated",
      est: "estimated",
      loading: "Loading usage…",
      emptyTitle: "No usage yet",
      emptyHint: "Translate something and your usage will appear here.",
      errorTitle: "Could not load usage data",
      errorHint: "The stats endpoint did not respond.",
      retry: "Retry",
      refresh: "Refresh",
      noActivity: "No activity in this period",
      less: "Less",
      more: "More",
    },
    "zh-CN": {
      title: "用量",
      range30: "最近 30 天",
      calendar: "日历 · 26 周",
      cost: "花费",
      calls: "调用",
      translations: "翻译",
      tokens: "Token",
      inTok: "输入",
      outTok: "输出",
      updated: "更新于",
      est: "估算",
      loading: "正在加载用量…",
      emptyTitle: "暂无使用记录",
      emptyHint: "翻译内容后，用量会显示在这里。",
      errorTitle: "无法加载用量数据",
      errorHint: "统计接口没有响应。",
      retry: "重试",
      refresh: "刷新",
      noActivity: "该时间段内没有活动",
      less: "少",
      more: "多",
    },
  };

  function t(key) {
    return (COPY[state.lang] || COPY.en)[key];
  }

  /* ---------- bridge ---------- */

  var pending = {};
  var ridSeq = 1;

  function bridgeFetch(url) {
    return new Promise(function (resolve, reject) {
      var rid = "r" + ridSeq++;
      pending[rid] = { resolve: resolve, reject: reject };
      parent.postMessage({ type: "subtr-plugin-fetch", rid: rid, url: url }, "*");
      setTimeout(function () {
        if (pending[rid]) {
          delete pending[rid];
          reject(new Error("timeout"));
        }
      }, 5000);
    });
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "subtr-plugin-init") {
      state.theme = data.theme === "dark" ? "dark" : "light";
      state.lang = data.lang === "zh-CN" ? "zh-CN" : "en";
      document.documentElement.classList.toggle("dark", state.theme === "dark");
      document.documentElement.lang = state.lang;
      render();
      return;
    }
    if (data.type === "subtr-plugin-fetch-result") {
      var entry = pending[data.rid];
      if (!entry) return;
      delete pending[data.rid];
      entry.resolve(data);
    }
  });

  function reportResize() {
    try {
      var height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );
      parent.postMessage({ type: "subtr-plugin-resize", height: height }, "*");
    } catch (e) {}
  }

  function scheduleResize() {
    requestAnimationFrame(function () {
      reportResize();
      requestAnimationFrame(reportResize);
    });
  }

  /* ---------- formatting ---------- */

  function fmtInt(n) {
    return Math.round(n).toLocaleString(state.lang);
  }

  function fmtCompact(n) {
    var v = Math.round(n);
    if (v >= 1e9) return trim(v / 1e9) + "B";
    if (v >= 1e6) return trim(v / 1e6) + "M";
    if (v >= 1e3) return trim(v / 1e3) + "k";
    return String(v);
  }

  function trim(v) {
    return v.toFixed(1).replace(/\.0$/, "");
  }

  function fmtCost(v) {
    if (v >= 1000) return "$" + trim(v / 1000) + "k";
    if (v >= 1) return "$" + v.toFixed(v < 10 ? 2 : 0);
    if (v > 0) return "$" + v.toFixed(3);
    return "$0";
  }

  // Precise value for stat cards and tooltips.
  function fmtFull(metric, v) {
    if (metric === "cost") return "$" + (v < 1 ? v.toFixed(4) : v.toFixed(2));
    return fmtInt(v);
  }

  // Short value for axis ticks.
  function fmtShort(metric, v) {
    if (metric === "cost") return fmtCost(v);
    return fmtCompact(v);
  }

  function metricValue(day) {
    if (!day) return 0;
    if (state.metric === "tokens") return day.tokens;
    return day[state.metric] || 0;
  }

  function parseKey(key) {
    var p = key.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function dateKey(d) {
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  var dayFmt, dayFullFmt, monthFmt, weekdayFmt, relFmt;
  function formatters() {
    dayFmt = new Intl.DateTimeFormat(state.lang, { month: "short", day: "numeric" });
    dayFullFmt = new Intl.DateTimeFormat(state.lang, {
      weekday: "short",
      month: "short",
      day: "numeric",
      year: "numeric",
    });
    monthFmt = new Intl.DateTimeFormat(state.lang, { month: "short" });
    weekdayFmt = new Intl.DateTimeFormat(state.lang, { weekday: "short" });
    relFmt = new Intl.RelativeTimeFormat(state.lang, { numeric: "auto" });
  }

  function fmtDay(key) {
    return dayFmt.format(parseKey(key));
  }

  function fmtDayFull(key) {
    return dayFullFmt.format(parseKey(key));
  }

  function fmtRelative(iso) {
    if (!iso) return "";
    var ts = new Date(iso).getTime();
    if (isNaN(ts)) return "";
    var diff = ts - Date.now();
    var abs = Math.abs(diff);
    var units = [
      ["year", 31536e6],
      ["month", 2592e6],
      ["day", 864e5],
      ["hour", 36e5],
      ["minute", 6e4],
    ];
    for (var i = 0; i < units.length; i++) {
      if (abs >= units[i][1] || units[i][0] === "minute") {
        return relFmt.format(Math.round(diff / units[i][1]), units[i][0]);
      }
    }
    return "";
  }

  /* ---------- data ---------- */

  function normalize(raw) {
    var src = raw || {};
    var daily = {};
    var list = src.daily;
    if (Array.isArray(list)) {
      list.forEach(function (p) {
        var k = String(p.date || "").slice(0, 10);
        if (k) daily[k] = pick(p);
      });
    } else if (list && typeof list === "object") {
      Object.keys(list).forEach(function (k) {
        daily[k.slice(0, 10)] = pick(list[k]);
      });
    }
    return {
      totals: {
        costUsd: num(src.costUsd),
        calls: num(src.calls),
        translations: num(src.translations),
        inTok: num(src.inTokens),
        outTok: num(src.outTokens),
        estimated: num(src.estimatedCount),
      },
      daily: daily,
      lastRecordAt: src.lastRecordAt || null,
    };
  }

  function num(v) {
    return typeof v === "number" && isFinite(v) ? v : 0;
  }

  function pick(d) {
    return {
      calls: num(d.calls),
      translations: num(d.translations),
      tokens: num(d.inTok) + num(d.outTok),
      cost: num(d.costUsd),
    };
  }

  function load() {
    if (!state.data) {
      state.status = "loading";
      render();
    }
    bridgeFetch("/api/stats")
      .then(function (res) {
        if (!res || !res.ok) throw new Error("HTTP " + (res && res.status));
        state.data = normalize(JSON.parse(res.body));
        var hasData =
          state.data.totals.calls > 0 || Object.keys(state.data.daily).length > 0;
        state.status = hasData ? "ready" : "empty";
      })
      .catch(function () {
        state.status = state.data ? "ready" : "error";
      })
      .then(render);
  }

  /* ---------- render ---------- */

  function render() {
    var root = document.getElementById("view");
    formatters();

    if (state.status === "loading") {
      root.innerHTML = loadingHTML();
      scheduleResize();
      return;
    }
    if (state.status === "error") {
      root.innerHTML = errorHTML();
      scheduleResize();
      return;
    }
    if (state.status === "empty") {
      root.innerHTML = emptyHTML();
      scheduleResize();
      return;
    }

    var totals = state.data.totals;
    root.innerHTML =
      headerHTML(totals) +
      statsHTML(totals) +
      chartHTML() +
      calendarHTML();

    renderChart();
    renderHeat();
    scheduleResize();
  }

  function refreshIcon() {
    return (
      '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>'
    );
  }

  function headerHTML(totals) {
    var rel = fmtRelative(state.data.lastRecordAt);
    var sub =
      t("range30") + (rel ? " · " + t("updated") + " <b>" + rel + "</b>" : "");
    var badge =
      totals.estimated > 0
        ? '<span class="pk-badge pk-badge--warn" title="' +
          fmtInt(totals.estimated) +
          " / " +
          fmtInt(totals.calls) +
          '">~ ' +
          t("est") +
          "</span>"
        : "";
    return (
      '<header class="pk-row-between app-head">' +
      '<div style="min-width:0">' +
      '<div class="pk-cluster" style="gap:8px">' +
      '<span class="app-title">' +
      t("title") +
      "</span>" +
      badge +
      "</div>" +
      '<p class="app-sub">' +
      sub +
      "</p>" +
      "</div>" +
      '<button type="button" class="pk-btn pk-btn--sm" data-action="reload">' +
      refreshIcon() +
      t("refresh") +
      "</button>" +
      "</header>"
    );
  }

  function statHTML(label, value, hint) {
    return (
      '<div class="pk-stat">' +
      '<span class="pk-stat-label">' +
      label +
      "</span>" +
      '<span class="pk-stat-value">' +
      value +
      "</span>" +
      (hint ? '<span class="pk-stat-hint">' + hint + "</span>" : "") +
      "</div>"
    );
  }

  function statsHTML(totals) {
    var tokenTotal = totals.inTok + totals.outTok;
    var est = totals.estimated > 0 ? "~" : "";
    return (
      '<section class="pk-stats pk-stats--4">' +
      statHTML(t("cost"), est + fmtFull("cost", totals.costUsd)) +
      statHTML(t("calls"), est + fmtInt(totals.calls)) +
      statHTML(t("translations"), est + fmtInt(totals.translations)) +
      statHTML(
        t("tokens"),
        est + fmtInt(tokenTotal),
        "↓ " +
          fmtCompact(totals.inTok) +
          " · ↑ " +
          fmtCompact(totals.outTok)
      ) +
      "</section>"
    );
  }

  function chartHTML() {
    var items = METRICS.map(function (m) {
      return (
        '<button type="button" class="pk-segmented__item" data-action="metric" data-metric="' +
        m +
        '" aria-pressed="' +
        (state.metric === m) +
        '">' +
        t(m) +
        "</button>"
      );
    }).join("");
    return (
      '<section class="pk-section">' +
      '<div class="chart-head">' +
      '<h2 class="pk-section-title">' +
      t("range30") +
      "</h2>" +
      '<div class="pk-segmented" role="group" aria-label="' +
      t("range30") +
      '">' +
      items +
      "</div>" +
      "</div>" +
      '<div class="pk-chart" id="chart">' +
      '<div class="pk-chart__yaxis" id="yaxis"></div>' +
      '<div class="pk-chart__canvas">' +
      '<div class="pk-chart__grid" id="grid"></div>' +
      '<div class="pk-bars" id="bars"></div>' +
      "</div>" +
      '<div class="pk-chart__xaxis" id="xaxis"></div>' +
      "</div>" +
      "</section>"
    );
  }

  function calendarHTML() {
    return (
      '<section class="pk-section">' +
      '<h2 class="pk-section-title">' +
      t("calendar") +
      "</h2>" +
      '<div class="pk-heat-wrap">' +
      '<div class="pk-heat-days" id="heatDays"></div>' +
      '<div class="pk-heat-body">' +
      '<div class="pk-heat-months" id="heatMonths"></div>' +
      '<div class="pk-heat" id="heat"></div>' +
      "</div>" +
      "</div>" +
      '<div class="pk-legend" id="legend"></div>' +
      "</section>"
    );
  }

  function loadingHTML() {
    return (
      '<div class="pk-loading"><span class="pk-spinner"></span>' + t("loading") + "</div>"
    );
  }

  function emptyHTML() {
    return (
      '<div class="pk-empty"><strong>' +
      t("emptyTitle") +
      "</strong><span>" +
      t("emptyHint") +
      "</span></div>"
    );
  }

  function errorHTML() {
    return (
      '<div class="pk-error"><strong>' +
      t("errorTitle") +
      "</strong><span>" +
      t("errorHint") +
      '</span><button type="button" class="pk-btn pk-btn--sm" style="margin-top:6px" data-action="reload">' +
      t("retry") +
      "</button></div>"
    );
  }

  /* ---------- chart ---------- */

  function lastNDays(n) {
    var out = [];
    var today = new Date();
    for (var i = n - 1; i >= 0; i--) {
      out.push(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i));
    }
    return out;
  }

  function renderChart() {
    var days = lastNDays(30);
    var values = days.map(function (d) {
      return metricValue(state.data.daily[dateKey(d)]);
    });
    var max = Math.max.apply(null, values.concat([0]));

    var chart = document.getElementById("chart");
    if (!chart) return;

    if (max <= 0) {
      chart.innerHTML =
        '<div class="pk-empty" style="grid-column:1/-1">' + t("noActivity") + "</div>";
      return;
    }

    var barsEl = document.getElementById("bars");
    barsEl.innerHTML = days
      .map(function (d, i) {
        var v = values[i];
        var pct = (v / max) * 100;
        var cls = "pk-bar" + (v > 0 ? "" : " is-empty");
        return (
          '<div class="' +
          cls +
          '" data-date="' +
          dateKey(d) +
          '" data-value="' +
          v +
          '"><div class="pk-bar__fill" style="--pk-h:' +
          Math.max(pct, v > 0 ? 2 : 1.5) +
          '%"></div></div>'
        );
      })
      .join("");

    document.getElementById("grid").innerHTML =
      '<div class="pk-chart__gridline" style="top:0"></div>' +
      '<div class="pk-chart__gridline" style="top:50%"></div>';

    document.getElementById("yaxis").innerHTML =
      "<span>" +
      fmtShort(state.metric, max) +
      "</span><span>" +
      fmtShort(state.metric, max / 2) +
      "</span><span>0</span>";

    var last = days.length - 1;
    document.getElementById("xaxis").innerHTML = days
      .map(function (d, i) {
        var show = (i % 7 === 0 && i <= last - 3) || i === last;
        var edge = i === 0 ? " pk-xcell--start" : i === last ? " pk-xcell--end" : "";
        return (
          '<span class="pk-xcell' +
          edge +
          '">' +
          (show ? fmtDay(dateKey(d)) : "") +
          "</span>"
        );
      })
      .join("");
  }

  /* ---------- calendar heatmap ---------- */

  function weekdayNames() {
    var names = [];
    // 2024-01-07 is a Sunday, so the array runs Sunday → Saturday.
    for (var i = 0; i < 7; i++) names.push(weekdayFmt.format(new Date(2024, 0, 7 + i)));
    return names;
  }

  function renderHeat() {
    var today = new Date();
    var todayKey = dateKey(today);
    var start = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate() - (WEEKS * 7 - 1)
    );
    start = new Date(
      start.getFullYear(),
      start.getMonth(),
      start.getDate() - start.getDay()
    );

    var cells = [];
    var max = 0;
    var cursor = new Date(start);
    while (cursor <= today) {
      var key = dateKey(cursor);
      var v = metricValue(state.data.daily[key]);
      if (v > max) max = v;
      cells.push({ date: new Date(cursor), key: key, value: v });
      cursor.setDate(cursor.getDate() + 1);
    }

    var names = weekdayNames();
    document.getElementById("heatDays").innerHTML = names
      .map(function (name, i) {
        var show = i === 1 || i === 3 || i === 5;
        return "<span>" + (show ? name : "") + "</span>";
      })
      .join("");

    document.getElementById("heat").innerHTML = cells
      .map(function (c) {
        var level = max > 0 && c.value > 0 ? Math.max(1, Math.ceil((c.value / max) * 5)) : 0;
        level = Math.max(0, Math.min(5, level));
        var cls = "pk-cell pk-lvl-" + level + (c.key === todayKey ? " is-today" : "");
        return (
          '<div class="' +
          cls +
          '" data-date="' +
          c.key +
          '" data-value="' +
          c.value +
          '"></div>'
        );
      })
      .join("");

    renderMonths(cells);

    document.getElementById("legend").innerHTML =
      "<span>" +
      t("less") +
      "</span>" +
      [1, 2, 3, 4, 5]
        .map(function (l) {
          return '<span class="pk-legend__item pk-lvl-' + l + '"></span>';
        })
        .join("") +
      "<span>" +
      t("more") +
      "</span>";
  }

  function renderMonths(cells) {
    var months = [];
    var weekIndex = 0;
    for (var j = 0; j < cells.length; j += 7) {
      var label = monthFmt.format(cells[j].date);
      var prev = months[months.length - 1];
      if (!prev || prev.label !== label) months.push({ label: label, start: weekIndex });
      weekIndex++;
    }
    document.getElementById("heatMonths").innerHTML = months
      .map(function (m) {
        return '<span style="left:' + m.start * CELL_STEP + 'px">' + m.label + "</span>";
      })
      .join("");
  }

  /* ---------- tooltips ---------- */

  function showTip(key, value, x, y) {
    var tip = document.getElementById("tip");
    tip.innerHTML = tooltipHTML(key, value);
    tip.style.left = x + "px";
    tip.style.top = y + "px";
    tip.classList.add("pk-tooltip--visible");
    var rect = tip.getBoundingClientRect();
    var clamped = Math.min(
      Math.max(x, rect.width / 2 + 6),
      window.innerWidth - rect.width / 2 - 6
    );
    tip.style.left = clamped + "px";
  }

  // Two lines: a muted date line, then the value + metric label. The whitespace
  // between the two block elements keeps the text content readable too.
  function tooltipHTML(key, value) {
    return (
      '<div class="pk-tooltip__date">' +
      fmtDayFull(key) +
      "</div>" +
      "\n" +
      '<div class="pk-tooltip__value">' +
      fmtFull(state.metric, value) +
      " " +
      t(state.metric) +
      "</div>"
    );
  }

  function hideTip() {
    document.getElementById("tip").classList.remove("pk-tooltip--visible");
  }

  /* ---------- events ---------- */

  function boot() {
    formatters();
    render();
    scheduleResize();
    load();
  }

  document.getElementById("view").addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "reload") {
      load();
    } else if (action === "metric") {
      var next = el.getAttribute("data-metric");
      if (next && next !== state.metric) {
        state.metric = next;
        render();
      }
    }
  });

  // Delegated tooltips: the bars/heat nodes are rebuilt on every render, but
  // the #view container is stable.
  document.getElementById("view").addEventListener("mousemove", function (e) {
    var target = e.target.closest ? e.target.closest("[data-date]") : null;
    if (!target) return hideTip();
    showTip(
      target.getAttribute("data-date"),
      Number(target.getAttribute("data-value") || 0),
      e.clientX,
      e.clientY
    );
  });
  document.getElementById("view").addEventListener("mouseleave", hideTip);
  window.addEventListener("scroll", hideTip, true);
  window.addEventListener("resize", function () {
    hideTip();
    scheduleResize();
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  if (typeof ResizeObserver !== "undefined") {
    var observer = new ResizeObserver(scheduleResize);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }
})();
</script>
</body>
</html>
