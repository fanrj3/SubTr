<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usage Stats</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --card: #f4f4f5;
    --accent: #4f46e5;
    --grid-empty: #ebebef;
    --tooltip-bg: rgba(24, 24, 27, 0.94);
    --tooltip-fg: #fafafa;
  }
  html.dark {
    --bg: #09090b;
    --fg: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --card: #18181b;
    --accent: #818cf8;
    --grid-empty: #1f1f23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 14px;
    overflow-x: hidden;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 520px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .stat {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    background: var(--card);
  }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; margin: 16px 0 8px; }
  .switcher { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .switcher button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    border-radius: 7px;
    padding: 4px 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .switcher button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 120px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .bar-wrap { flex: 0 0 8px; height: 100%; display: flex; align-items: flex-end; }
  .bar { width: 100%; min-height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .heat {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 11px);
    gap: 2px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--grid-empty); }
  .cell.today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .lvl1 { background: color-mix(in srgb, var(--accent) 25%, var(--grid-empty)); }
  .lvl2 { background: color-mix(in srgb, var(--accent) 45%, var(--grid-empty)); }
  .lvl3 { background: color-mix(in srgb, var(--accent) 65%, var(--grid-empty)); }
  .lvl4 { background: color-mix(in srgb, var(--accent) 82%, var(--grid-empty)); }
  .lvl5 { background: var(--accent); }
  .legend { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .legend .cell { width: 9px; height: 9px; }
  .empty { color: var(--muted); font-size: 12px; padding: 12px 0; }
  #tooltip {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-fg);
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -120%);
    transition: opacity 0.08s ease;
  }
</style>
</head>
<body>
  <div class="stats" id="stats"></div>

  <h2 id="chart-title">Last 30 days</h2>
  <div class="switcher" id="switcher"></div>
  <div class="bars" id="bars"></div>

  <h2 id="calendar-title">Calendar</h2>
  <div class="heat" id="heat"></div>
  <div class="legend" id="legend"></div>

  <div id="tooltip"></div>

<script>
(function () {
  "use strict";

  var state = {
    theme: "light",
    lang: "en",
    metric: "calls",
    data: null,
    loading: false,
  };

  var COPY = {
    en: {
      cost: "Cost",
      calls: "Calls",
      translations: "Translations",
      tokens: "Tokens",
      last30: "Last 30 days",
      calendar: "Calendar (26 weeks)",
      empty: "No usage data yet.",
      less: "Less",
      more: "More",
    },
    "zh-CN": {
      cost: "花费",
      calls: "调用",
      translations: "翻译",
      tokens: "Token",
      last30: "最近 30 天",
      calendar: "日历（26 周）",
      empty: "暂无使用数据。",
      less: "少",
      more: "多",
    },
  };

  function t(key) {
    return (COPY[state.lang] || COPY.en)[key];
  }

  /* ---------- bridge ---------- */

  var pending = {};
  var ridSeq = 1;

  function bridgeFetch(url) {
    return new Promise(function (resolve, reject) {
      var rid = "r" + ridSeq++;
      pending[rid] = { resolve: resolve, reject: reject };
      parent.postMessage({ type: "subtr-plugin-fetch", rid: rid, url: url }, "*");
      setTimeout(function () {
        if (pending[rid]) {
          delete pending[rid];
          reject(new Error("timeout"));
        }
      }, 5000);
    });
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "subtr-plugin-init") {
      state.theme = data.theme === "dark" ? "dark" : "light";
      state.lang = data.lang === "zh-CN" ? "zh-CN" : "en";
      document.documentElement.classList.toggle("dark", state.theme === "dark");
      render();
      if (!state.data && !state.loading) loadStats();
      return;
    }
    if (data.type === "subtr-plugin-fetch-result") {
      var entry = pending[data.rid];
      if (!entry) return;
      delete pending[data.rid];
      try {
        entry.resolve(data);
      } catch (e) {
        entry.reject(e);
      }
    }
  });

  function reportResize() {
    try {
      var height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );
      parent.postMessage({ type: "subtr-plugin-resize", height: height }, "*");
    } catch (e) {}
  }

  /* ---------- data ---------- */

  function loadStats() {
    state.loading = true;
    bridgeFetch("/api/stats")
      .then(function (res) {
        if (!res.ok) throw new Error("bad");
        state.data = normalize(JSON.parse(res.body));
      })
      .catch(function () {
        state.data = null;
      })
      .then(function () {
        state.loading = false;
        render();
      });
  }

  function normalize(raw) {
    var totals = raw.totals || raw;
    var map = {};
    var daily = raw.daily;
    if (Array.isArray(daily)) {
      daily.forEach(function (d) {
        var date = (d.date || d.day || d.ts || "").slice(0, 10);
        if (!date) return;
        map[date] = pick(d);
      });
    } else if (daily && typeof daily === "object") {
      Object.keys(daily).forEach(function (date) {
        map[date.slice(0, 10)] = pick(daily[date]);
      });
    }
    return {
      totals: {
        costUsd: Number(totals.costUsd || 0),
        calls: Number(totals.calls || 0),
        translations: Number(totals.translations || 0),
        inTokens: Number(totals.inTokens || 0),
        outTokens: Number(totals.outTokens || 0),
        estimatedCount: Number(totals.estimatedCount || 0),
      },
      daily: map,
    };
  }

  function pick(d) {
    return {
      calls: Number(d.calls || 0),
      translations: Number(d.translations || 0),
      tokens: Number(d.inTokens || 0) + Number(d.outTokens || 0),
      cost: Number(d.costUsd || 0),
    };
  }

  function metricValue(day) {
    if (!day) return 0;
    return day[state.metric] || 0;
  }

  function formatValue(value) {
    if (state.metric === "cost") return "$" + value.toFixed(4);
    if (value >= 1000) return (value / 1000).toFixed(1) + "k";
    return String(Math.round(value));
  }

  function dateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function lastNDays(n) {
    var out = [];
    var today = new Date();
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      out.push(d);
    }
    return out;
  }

  /* ---------- render ---------- */

  function render() {
    var root = document.getElementById("stats");
    if (!root) return;
    if (!state.data) {
      root.innerHTML = '<div class="empty" style="grid-column:1/-1">' +
        (state.loading ? "…" : t("empty")) + "</div>";
      document.getElementById("bars").innerHTML = "";
      document.getElementById("heat").innerHTML = "";
      document.getElementById("legend").innerHTML = "";
      document.getElementById("switcher").innerHTML = "";
      reportResize();
      return;
    }

    var totals = state.data.totals;
    var tokenTotal = totals.inTokens + totals.outTokens;
    var est = totals.estimatedCount > 0 ? "~" : "";
    root.innerHTML =
      stat(t("cost"), est + "$" + totals.costUsd.toFixed(4)) +
      stat(t("calls"), est + formatValue(totals.calls)) +
      stat(t("translations"), est + formatValue(totals.translations)) +
      stat(t("tokens"), est + formatValue(tokenTotal));

    document.getElementById("chart-title").textContent = t("last30");
    document.getElementById("calendar-title").textContent = t("calendar");

    renderSwitcher();
    renderBars();
    renderHeat();
    reportResize();
  }

  function stat(label, value) {
    return '<div class="stat"><div class="label">' + label +
      '</div><div class="value">' + value + "</div></div>";
  }

  function renderSwitcher() {
    var el = document.getElementById("switcher");
    var metrics = ["calls", "translations", "tokens", "cost"];
    el.innerHTML = metrics
      .map(function (m) {
        return '<button type="button" data-metric="' + m + '" class="' +
          (state.metric === m ? "active" : "") + '">' + t(m) + "</button>";
      })
      .join("");
    Array.prototype.forEach.call(el.querySelectorAll("button"), function (btn) {
      btn.addEventListener("click", function () {
        state.metric = btn.getAttribute("data-metric");
        render();
      });
    });
  }

  function renderBars() {
    var el = document.getElementById("bars");
    var days = lastNDays(30);
    var values = days.map(function (d) {
      return metricValue(state.data.daily[dateKey(d)]);
    });
    var max = Math.max.apply(null, values.concat([0]));
    el.innerHTML = days
      .map(function (d, i) {
        var v = values[i];
        var pct = max > 0 ? Math.round((v / max) * 100) : 0;
        return '<div class="bar-wrap" data-date="' + dateKey(d) +
          '" data-value="' + v + '"><div class="bar" style="height:' +
          Math.max(2, pct) + '%"></div></div>';
      })
      .join("");
    bindTooltips(el, days);
  }

  function renderHeat() {
    var el = document.getElementById("heat");
    var today = new Date();
    var todayKey = dateKey(today);
    var start = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate() - (26 * 7 - 1)
    );
    start = new Date(
      start.getFullYear(),
      start.getMonth(),
      start.getDate() - start.getDay()
    );

    var cells = [];
    var max = 0;
    var cursor = new Date(start);
    while (cursor <= today) {
      var key = dateKey(cursor);
      var v = metricValue(state.data.daily[key]);
      if (v > max) max = v;
      cells.push({ date: new Date(cursor), key: key, value: v });
      cursor.setDate(cursor.getDate() + 1);
    }

    el.innerHTML = cells
      .map(function (c) {
        var level = max > 0 && c.value > 0 ? Math.ceil((c.value / max) * 5) : 0;
        level = Math.max(0, Math.min(5, level));
        var cls = "cell" + (c.value > 0 ? " lvl" + level : "") +
          (c.key === todayKey ? " today" : "");
        return '<div class="' + cls + '" data-date="' + c.key +
          '" data-value="' + c.value + '"></div>';
      })
      .join("");
    bindTooltips(el, cells);

    document.getElementById("legend").innerHTML =
      '<span>' + t("less") + "</span>" +
      '<div class="cell"></div><div class="cell lvl1"></div><div class="cell lvl2"></div>' +
      '<div class="cell lvl3"></div><div class="cell lvl4"></div><div class="cell lvl5"></div>' +
      '<span>' + t("more") + "</span>";
  }

  function bindTooltips(container, days) {
    var tooltip = document.getElementById("tooltip");
    var byDate = {};
    days.forEach(function (d) {
      byDate[d.key || dateKey(d.date || d)] = d;
    });
    Array.prototype.forEach.call(
      container.querySelectorAll("[data-date]"),
      function (node) {
        node.addEventListener("mousemove", function (e) {
          var key = node.getAttribute("data-date");
          var value = Number(node.getAttribute("data-value") || 0);
          tooltip.textContent = key + " · " + formatValue(value);
          tooltip.style.left = e.clientX + "px";
          tooltip.style.top = e.clientY + "px";
          tooltip.style.opacity = "1";
        });
        node.addEventListener("mouseleave", function () {
          tooltip.style.opacity = "0";
        });
      }
    );
    void byDate;
  }

  window.addEventListener("resize", reportResize);
  document.addEventListener("DOMContentLoaded", reportResize);
})();
</script>
</body>
</html>
