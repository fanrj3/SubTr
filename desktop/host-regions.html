<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { font: 12px -apple-system, system-ui, sans-serif; }
      #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
      .box {
        position: absolute; border-radius: 4px; cursor: pointer;
        transition: background-color 90ms ease, box-shadow 90ms ease;
      }
      .box.glow { box-shadow: 0 0 0 1.5px rgba(255,255,255,.25), 0 0 10px 2px var(--accent); }
      .box.glow:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .box.boxstyle { border: 2px solid var(--accent); }
      .box.boxstyle:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .box.underline { border-bottom: 3px solid var(--accent); }
      .box.underline:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
      .badge {
        position: absolute; top: -9px; left: -9px; min-width: 16px; height: 16px;
        padding: 0 3px; border-radius: 8px; background: var(--accent); color: #fff;
        font-size: 10px; line-height: 16px; text-align: center; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <script>
      const shot = document.getElementById("shot");
      let state = { id: "", boxes: [], style: {}, interactive: true };
      let hovered = null;

      function emit(ev) { window.subtrHost.regionEvent(ev); }

      function render() {
        shot.src = state.imageDataUrl || "";
        for (const el of [...document.querySelectorAll(".box")]) el.remove();
        const accent = (state.style && state.style.accent) || "#4da3ff";
        const hl = (state.style && state.style.highlight) || "glow";
        const numbered = !state.style || state.style.numbered !== false;
        document.documentElement.style.setProperty("--accent", accent);
        state.boxes.forEach((b, i) => {
          const el = document.createElement("div");
          el.className = "box " + (hl === "box" ? "boxstyle" : hl === "underline" ? "underline" : "glow");
          el.style.left = (b.xPct * 100) + "%";
          el.style.top = (b.yPct * 100) + "%";
          el.style.width = (b.wPct * 100) + "%";
          el.style.height = (b.hPct * 100) + "%";
          el.dataset.boxId = String(b.id);
          el.title = b.text || "";
          if (numbered && i < 9) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = String(i + 1);
            el.appendChild(badge);
          }
          el.addEventListener("mouseenter", () => {
            if (hovered === b.id) return;
            hovered = b.id;
            emit({ type: "hover", id: state.id, boxId: b.id });
          });
          el.addEventListener("mouseleave", () => {
            if (hovered !== b.id) return;
            hovered = null;
            emit({ type: "hover", id: state.id, boxId: null });
          });
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            emit({ type: "select", id: state.id, boxId: b.id, index: i + 1 });
          });
          document.body.appendChild(el);
        });
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { emit({ type: "dismiss", id: state.id, reason: "esc" }); return; }
        const n = Number(e.key);
        if (Number.isInteger(n) && n >= 1 && n <= 9 && state.boxes[n - 1]) {
          emit({ type: "select", id: state.id, boxId: state.boxes[n - 1].id, index: n });
        }
      });
      document.addEventListener("click", () => emit({ type: "dismiss", id: state.id, reason: "click-away" }));

      window.subtrHost.onRegionsInit((payload) => {
        state = { ...state, ...payload, boxes: payload.boxes || [], style: payload.style || {} };
        render();
        // Scripted hover (SUBTR_TEST): emit a hover for a named box after render.
        if (payload.testHoverId) {
          setTimeout(() => emit({ type: "hover", id: state.id, boxId: payload.testHoverId }), 60);
        }
      });
      window.subtrHost.onRegionsUpdate?.((payload) => {
        if (payload.boxes) state.boxes = payload.boxes;
        if (payload.style) state.style = { ...state.style, ...payload.style };
        render();
      });
    </script>
  </body>
</html>
