<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { cursor: crosshair; font: 12px -apple-system, system-ui, sans-serif; }
      #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
      #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
      #sel { position: fixed; border: 1px solid #4da3ff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); display: none; }
      #sel.on { display: block; }
      #size {
        position: fixed; padding: 2px 6px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.75); color: #fff; white-space: nowrap; display: none;
      }
      #hint {
        position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
        padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.7);
        color: #fff; opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="dim"></div>
    <div id="sel"></div>
    <div id="size"></div>
    <div id="hint">Drag to select · Enter / double-click to confirm · Esc to cancel</div>
    <script>
      const shot = document.getElementById("shot");
      const sel = document.getElementById("sel");
      const dim = document.getElementById("dim");
      const sizeEl = document.getElementById("size");
      let minW = 8, minH = 8;
      let sx = 0, sy = 0, ex = 0, ey = 0, dragging = false, has = false;

      function rect() {
        const x = Math.min(sx, ex), y = Math.min(sy, ey);
        return { x, y, w: Math.abs(ex - sx), h: Math.abs(ey - sy) };
      }
      function paint() {
        const r = rect();
        sel.style.left = r.x + "px";
        sel.style.top = r.y + "px";
        sel.style.width = r.w + "px";
        sel.style.height = r.h + "px";
        sizeEl.textContent = Math.round(r.w) + " × " + Math.round(r.h);
        sizeEl.style.left = r.x + "px";
        sizeEl.style.top = Math.max(0, r.y - 20) + "px";
      }
      function confirm() {
        const r = rect();
        if (!has || r.w < minW || r.h < minH) return;
        window.subtrHost.completeCapture(r);
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); window.subtrHost.cancelCapture(); }
        else if (e.key === "Enter") { e.preventDefault(); confirm(); }
      });
      window.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        // Click without drag = restart selection; click-away with a box = keep.
        dragging = true; has = false;
        sx = ex = e.clientX; sy = ey = e.clientY;
        sel.classList.add("on"); sizeEl.style.display = "block"; paint();
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        ex = e.clientX; ey = e.clientY; has = true; paint();
      });
      window.addEventListener("mouseup", (e) => {
        if (e.button !== 0) return;
        dragging = false;
        const r = rect();
        if (r.w >= minW && r.h >= minH) confirm();
      });
      window.addEventListener("dblclick", confirm);

      window.subtrHost.onCaptureInit((payload) => {
        shot.src = payload.imageDataUrl;
        if (payload.minSize) { minW = payload.minSize.w || minW; minH = payload.minSize.h || minH; }
        // Scripted/test drag: pre-place a selection so it can be confirmed.
        if (payload.testRect) {
          sel.classList.add("on"); sizeEl.style.display = "block";
          sx = payload.testRect.x; sy = payload.testRect.y;
          ex = payload.testRect.x + payload.testRect.w;
          ey = payload.testRect.y + payload.testRect.h;
          has = true; paint();
          // Scripted drag (SUBTR_TEST): confirm through the normal path.
          setTimeout(confirm, 120);
        }
      });
    </script>
  </body>
</html>
